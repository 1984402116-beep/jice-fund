name: 每日更新基金快照

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 北京 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取净值并重算指标
        run: node scripts/update-pool.mjs pool.json
      - name: 提交变更
        run: |
          git config user.name "jice-bot"
          git config user.email "jice-bot@users.noreply.github.com"
          if git diff --quiet pool.json; then echo "数据无变化，跳过提交"; exit 0; fi
          git add pool.json
          git commit -m "data: 更新基金快照 $(date -u +%F)"
          git push
