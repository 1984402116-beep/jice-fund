<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>季策 · 基金季度配置助手（2026-11-19）</title>
<meta name="description" content="每季度一次基金配置参考：风险测评、核心-卫星分配、组合风险估算与调仓清单。仅供参考，不构成投资建议。做者：杰杰" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f6f5c'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E5%AD%A3%3C/text%3E%3C/svg%3E" />
<meta name="theme-color" content="#0f6f5c" />
<style>
:root {
  --bg: #f5f5f1;
  --card: #ffffff;
  --ink: #14181f;
  --ink-2: #3d4553;
  --muted: #7a8291;
  --line: #e6e4dc;
  --line-2: #efece4;
  --brand: #0f6f5c;
  --brand-soft: #e8f2ef;
  --buy: #0f6f5c;
  --sell: #b45309;
  --hold: #6b7280;
  --warn-bg: #fdf6ec;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 8px 24px rgba(20, 24, 31, 0.04);
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  max-width: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; font-size: inherit; cursor: pointer; }
input, select { font-family: inherit; font-size: inherit; color: var(--ink); }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 26px;
  background: rgba(245, 245, 241, 0.88);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 9px; font-weight: 700; letter-spacing: -0.02em; }
.brand b { font-size: 19px; }
.brand span { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
.topbar .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 12px; color: var(--ink-2);
  background: #fff; border: 1px solid var(--line);
  white-space: nowrap;
}
.chip.q { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.chip.warn { background: var(--warn-bg); border-color: #f0ddc0; color: #8a5a12; }

/* ---------- 标签页 ---------- */
.tabs {
  display: flex; gap: 4px; padding: 10px 26px 0; max-width: 1280px; margin: 0 auto;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  border: 0; background: transparent; color: var(--muted); white-space: nowrap;
  padding: 8px 14px; border-radius: 10px; font-weight: 500; flex: 0 0 auto;
}
.tabs button:hover { background: #edede7; color: var(--ink); }
.tabs button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }

main { max-width: 1280px; margin: 0 auto; padding: 18px 26px 60px; }
.view { display: none; }
.view.on { display: block; animation: fade 0.18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* ---------- 通用卡片 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; margin-bottom: 16px;
}
.card h3 {
  margin: 0 0 12px; font-size: 13px; font-weight: 600;
  color: var(--muted); letter-spacing: 0.04em; text-transform: none;
  display: flex; align-items: center; justify-content: space-between;
}
.card h3 .hint { font-weight: 400; letter-spacing: 0; color: #a3a9b4; font-size: 12px; }

.plan-grid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
.plan-grid > * { min-width: 0; }
.card, .report-head, .report-head > div { min-width: 0; }
.report-sub { overflow-wrap: anywhere; }
@media (max-width: 980px) { .plan-grid { grid-template-columns: 1fr; } .topbar { flex-wrap: wrap; } }

/* ---------- 控制面板 ---------- */
.field { margin-bottom: 16px; }
.field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.money-input { display: flex; align-items: center; gap: 6px; }
.money-input input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;
  background: #fbfbf8; outline: none;
}
.money-input input:focus { border-color: var(--brand); background: #fff; }
.money-input .unit { color: var(--muted); font-size: 13px; }

.risk-opts { display: grid; gap: 6px; }
.risk-opt {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 9px 11px; border-radius: 11px; border: 1px solid var(--line);
  background: #fbfbf8; text-align: left; transition: 0.12s;
}
.risk-opt:hover { border-color: #cfd6d2; background: #fff; }
.risk-opt.on { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.risk-opt .rk { font-weight: 600; font-size: 13px; }
.risk-opt .rd { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.risk-opt .mix { flex: 1; min-width: 0; }
.risk-opt .bar { margin-top: 5px; display: flex; height: 4px; border-radius: 3px; overflow: hidden; gap: 1px; }
.risk-opt .bar i { display: block; height: 100%; }

.hold-list { display: grid; gap: 8px; }
.hold-row { display: grid; grid-template-columns: 1fr 96px 26px; gap: 6px; align-items: center; }
.hold-row select, .hold-row input {
  width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px;
  background: #fbfbf8; font-size: 12.5px; outline: none; min-width: 0;
}
.hold-row input { text-align: right; font-variant-numeric: tabular-nums; }
.hold-row button {
  border: 0; background: transparent; color: #b9bec7; font-size: 16px; line-height: 1; padding: 4px;
}
.hold-row button:hover { color: var(--sell); }
.hold-empty { font-size: 12px; color: var(--muted); padding: 6px 0; }
.link-btn {
  border: 0; background: transparent; color: var(--brand); font-size: 12.5px;
  padding: 4px 0; font-weight: 500;
}
.link-btn:hover { text-decoration: underline; }

.btn {
  width: 100%; border: 0; border-radius: 11px; padding: 12px;
  background: var(--brand); color: #fff; font-weight: 600; font-size: 14px;
  transition: 0.15s;
}
.btn:hover { background: #0b5a4a; }
.btn:disabled { background: #cfd3cd; color: #f6f6f3; cursor: not-allowed; }
.btn.ghost {
  background: #fff; color: var(--ink); border: 1px solid var(--line); width: auto; padding: 8px 14px;
  font-weight: 500; font-size: 13px;
}
.btn.ghost:hover { background: #f7f7f2; border-color: #cfd6d2; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- 报告 ---------- */
.report-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.report-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
.report-sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; background: var(--brand-soft); color: var(--brand);
}
.badge.gray { background: #f0f0ec; color: var(--muted); }
.badge.amber { background: var(--warn-bg); color: #8a5a12; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0 4px; }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 13px; background: #fbfbf8; }
.kpi .k { font-size: 11.5px; color: var(--muted); }
.kpi .v { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }

.mixbar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin: 8px 0 10px; gap: 2px; }
.mixbar > div { position: relative; display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: #fff; font-weight: 600; overflow: hidden; }
.mixlegend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); }
.mixlegend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
.tablewrap { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.grid td .fname { white-space: normal; overflow-wrap: anywhere; }
.th-short { display: none; }
#poolTable th { white-space: nowrap; }
#poolTable td:first-child { min-width: 150px; max-width: 260px; }
table.grid th {
  text-align: left; font-size: 11.5px; font-weight: 500; color: var(--muted);
  padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.grid td { padding: 9px 8px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid tbody tr:hover { background: #fcfcf9; }
table.grid .num { text-align: right; font-variant-numeric: tabular-nums; }
.fname { font-weight: 500; }
.fcode { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mix-pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
  padding: 2px 7px; border-radius: 6px; background: #f2f2ee; color: var(--ink-2); white-space: nowrap;
}
.tone-buy { color: var(--buy); font-weight: 600; }
.tone-sell { color: var(--sell); font-weight: 600; }
.tone-hold { color: var(--hold); font-weight: 500; }
.wbar { width: 56px; height: 4px; border-radius: 3px; background: #eeeee9; display: inline-block; vertical-align: middle; overflow: hidden; }
.wbar i { display: block; height: 100%; background: var(--brand); }

.notes { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { font-size: 12.5px; color: var(--ink-2); padding-left: 14px; position: relative; }
.notes li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); opacity: 0.6; }

.empty {
  text-align: center; padding: 46px 20px; border: 1px dashed var(--line);
  border-radius: 14px; background: #fbfbf8;
}
.empty .big { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.empty .sub { color: var(--muted); font-size: 12.5px; max-width: 420px; margin: 0 auto 16px; }

/* ---------- 基金池 ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar input[type="search"] {
  flex: 1; min-width: 180px; padding: 8px 11px; border: 1px solid var(--line);
  border-radius: 10px; background: #fbfbf8; outline: none;
}
.toolbar input[type="search"]:focus { border-color: var(--brand); background: #fff; }
.pill {
  border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  padding: 6px 11px; border-radius: 999px; font-size: 12px;
}
.pill.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.sortable { cursor: pointer; user-select: none; }
.sortable:hover { color: var(--ink); }
.sortable.asc::after { content: " ↑"; }
.sortable.desc::after { content: " ↓"; }

.drawer {
  position: fixed; inset: 0; background: rgba(20, 24, 31, 0.28);
  display: none; z-index: 40; align-items: flex-end; justify-content: center;
}
.drawer.on { display: flex; }
.drawer-body {
  background: #fff; width: min(560px, 100%); max-height: 82vh; overflow: auto;
  border-radius: 18px 18px 0 0; padding: 20px; animation: up 0.2s ease;
}
@keyframes up { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer h4 { margin: 0; font-size: 16px; }
.factor-row { display: grid; grid-template-columns: 96px 1fr 52px; gap: 10px; align-items: center; margin: 9px 0; font-size: 12.5px; }
.factor-row .bar { height: 6px; background: #f0f0eb; border-radius: 3px; overflow: hidden; }
.factor-row .bar i { display: block; height: 100%; background: linear-gradient(90deg, #7fb8a8, var(--brand)); }
.factor-row b { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }

/* ---------- 历史 ---------- */
.hist-item { border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; margin-bottom: 10px; background: #fff; }
.hist-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.hist-q { font-weight: 700; font-size: 15px; }
.hist-meta { color: var(--muted); font-size: 12px; }

/* ---------- 方法 ---------- */
.prose { max-width: 760px; font-size: 13.5px; color: var(--ink-2); }
.prose h4 { font-size: 14px; color: var(--ink); margin: 22px 0 8px; }
.prose h4:first-child { margin-top: 0; }
.prose p { margin: 8px 0; }
.prose code {
  font-family: var(--mono); font-size: 12px; background: #f2f2ee;
  padding: 1px 5px; border-radius: 5px;
}
.prose table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12.5px; }
.prose th, .prose td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line-2); }
.callout {
  border-left: 3px solid var(--brand); background: var(--brand-soft);
  padding: 12px 14px; border-radius: 0 10px 10px 0; font-size: 12.5px; margin: 12px 0;
}
.callout.warn { border-color: #d99a3f; background: var(--warn-bg); }

/* ---------- 提示 ---------- */
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px);
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: 0.22s; z-index: 60;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

footer.foot {
  max-width: 1280px; margin: 0 auto; padding: 0 26px 40px;
  color: #9aa0aa; font-size: 11.5px; line-height: 1.7;
}
@media print {
  .topbar, .tabs, .side, .btn-row, footer.foot { display: none !important; }
  body { background: #fff; }
  .card { box-shadow: none; border-color: #ddd; break-inside: avoid; }
}

/* ---------- 手机端 ---------- */
@media (max-width: 560px) {
  .topbar { padding: 10px 14px; gap: 8px; }
  .brand b { font-size: 17px; }
  .brand span { display: none; }
  main { padding: 12px 14px 48px; }
  .tabs { padding: 8px 14px 0; gap: 2px; }
  .tabs button { padding: 8px 10px; font-size: 13px; }
  .card { padding: 15px; border-radius: 14px; }
  .report-title { font-size: 19px; }
  .kpi .v { font-size: 19px; }
  footer.foot { padding: 0 14px 32px; }
  .chip { font-size: 11px; padding: 3px 8px; }
  table.grid { font-size: 12.5px; }
  table.grid th, table.grid td { padding: 7px 6px; }
  .money-input input { font-size: 18px; }
}

/* 调仓表在窄屏只保留关键列，避免横向溢出 */
@media (max-width: 720px) {
  #allocTable { table-layout: fixed; font-size: 12px; }
  #allocTable .c-hide-sm { display: none; }
  #allocTable th, #allocTable td { padding: 7px 4px; }
  #allocTable .mix-pill { display: none; }
  #allocTable th:nth-child(1) { width: 30%; }
  #allocTable th:nth-child(3) { width: 13%; }
  #allocTable th:nth-child(4) { width: 17%; }
  #allocTable th:nth-child(6) { width: 17%; }
  #allocTable th:nth-child(7) { width: 11%; }
  #allocTable th:nth-child(8) { width: 12%; }
  #allocTable .wbar { display: none; }
  .th-long { display: none; }
  .th-short { display: inline; }
  #allocTable th { font-size: 11px; letter-spacing: -0.01em; }
  #poolTable .c-1y, #poolTable .c-vol, #poolTable .c-sharpe, #poolTable .c-scale { display: none; }
  #poolTable { table-layout: fixed; }
  #poolTable th:nth-child(1) { width: 40%; }
  #poolTable th:nth-child(2) { width: 21%; }
  #poolTable th:nth-child(4) { width: 15%; }
  #poolTable th:nth-child(5) { width: 15%; }
  #poolTable th:nth-child(9) { width: 9%; }
  #poolTable td:first-child { min-width: 0; max-width: none; }
  #poolTable .mix-pill { padding: 2px 5px; font-size: 10.5px; }
  #poolTable .wbar { display: none; }
  #poolTable th, #poolTable td { padding: 7px 4px; }
  #allocTable td .fname { font-size: 12.5px; line-height: 1.35; }
  #allocTable .reasons span:nth-child(n + 2) { display: none; }
}

/* ---------- 持仓行（含买入日期） ---------- */
.hold-item { display: grid; gap: 3px; }
.hold-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); padding-left: 2px; }
.hold-meta input[type="date"] {
  padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px;
  background: #fbfbf8; font-size: 11.5px; color: var(--ink-2); outline: none;
}
.hold-meta input[type="date"]:focus { border-color: var(--brand); background: #fff; }
.hold-meta span { color: #a3a9b4; }
.sell-hint td { font-size: 12px; color: #8a5a12; background: var(--warn-bg); padding: 7px 10px !important; line-height: 1.55; }

/* ---------- 换仓提示 ---------- */
.swap-card { border-color: #f0d9b5; background: linear-gradient(180deg, #fffdf8, #fff); }
.swap-lead { font-size: 12.5px; color: var(--ink-2); margin: 0 0 6px; line-height: 1.6; }
.swap-row {
  display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr);
  gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line-2);
}
.swap-row:last-of-type { border-bottom: 0; }
.swap-side { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
.swap-tag {
  font-size: 10.5px; padding: 2px 6px; border-radius: 5px; font-weight: 600;
  flex: 0 0 auto; margin-top: 2px;
}
.swap-tag.sell { background: #fdf1e3; color: #8a5a12; }
.swap-tag.buy { background: var(--brand-soft); color: var(--brand); }
.swap-arrow { text-align: center; color: #b9bec7; }
.swap-inline { margin-top: 14px; border-top: 1px solid var(--line-2); padding-top: 12px; }
.swap-title { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
.swap-title .hint { font-weight: 400; color: #a3a9b4; margin-left: 6px; }
@media (max-width: 560px) {
  .swap-row { grid-template-columns: 1fr; gap: 4px; }
  .swap-arrow { transform: rotate(90deg); padding: 2px 0; }
}

/* ---------- 人话结论 ---------- */
.plainbox {
  margin-top: 16px; padding: 14px 16px; border-radius: 12px;
  background: #f4f8f6; border: 1px solid #dbe9e3;
}
.plainbox-title {
  font-size: 11.5px; font-weight: 700; color: var(--brand);
  letter-spacing: 0.08em; margin-bottom: 6px;
}
.plainbox p { margin: 0 0 6px; font-size: 13px; color: var(--ink-2); line-height: 1.75; }
.plainbox p:last-child { margin-bottom: 0; }
.plainbox-next { font-size: 12.5px !important; color: #4b5a63 !important; }
.kpi-sub { font-size: 10.5px; color: #9aa0aa; line-height: 1.45; margin-top: 4px; }

/* ---------- 理由标签 ---------- */
.reasons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.reasons span {
  font-size: 10px; padding: 1px 6px; border-radius: 5px;
  background: #f0f4f2; color: #4f6b60; white-space: nowrap;
}

/* ---------- 新手引导 ---------- */
.welcome h2 { font-size: 19px; margin: 0 0 4px; letter-spacing: -0.02em; }
.welcome-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; }
.steps { display: grid; gap: 10px; margin-bottom: 16px; }
.step { display: flex; gap: 11px; align-items: flex-start; }
.step i {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
  background: var(--brand); color: #fff; font-style: normal; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin-top: 1px;
}
.step b { display: block; font-size: 13.5px; }
.step span { font-size: 12px; color: var(--muted); }
.quick-amt { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.quick-amt button {
  border: 1px solid var(--line); background: #fff; color: var(--ink-2);
  padding: 5px 11px; border-radius: 999px; font-size: 12px;
}

  { key: "vol3y", label: "波动率", weight: 0.1, better: "low" },
  { key: "feeRate", label: "申购费率", weight: 0.1, better: "low" },
  { key: "r1y", label: "近一年动量", weight: 0.05, better: "high" },
  { key: "scaleFit", label: "规模适配", weight: 0.05, better: "high" },
  { key: "managerYears", label: "经理任职", weight: 0.05, better: "high" },
];

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round100 = (v) => Math.round(v / 100) * 100;

function scaleFit(scale) {
  if (!scale || scale <= 0) return 0;
  // 20~150 亿最舒适；过小有清盘/流动性风险，过大有策略容量问题
  const x = Math.log10(scale);
  const ideal = Math.log10(60);
  return clamp(1 - Math.abs(x - ideal) / 1.6, 0, 1);
}

function rawValue(fund, key) {
  switch (key) {
    case "scaleFit": return scaleFit(fund.scale);
    case "managerYears": return clamp(fund.managerYears ?? 0, 0, 8);
    case "feeRate": return fund.feeRate ?? 0.15;
    default: return Number.isFinite(fund[key]) ? fund[key] : null;
  }
}

const minMax = (arr) => {
  const vals = arr.filter((v) => v !== null && Number.isFinite(v));
  if (!vals.length) return { lo: 0, hi: 0 };
  return { lo: Math.min(...vals), hi: Math.max(...vals) };
};

/** 同大类内打分，返回 0~100 的综合分与因子明细 */
function scoreFunds(funds) {
  const byBucket = new Map();
  for (const f of funds) {
    if (!byBucket.has(f.bucket)) byBucket.set(f.bucket, []);
    byBucket.get(f.bucket).push(f);
  }
  const scored = new Map();

  for (const [bucket, peers] of byBucket) {
    const isCash = bucket === "cash";
    const active = isCash ? [{ key: "cagr3y", weight: 1, better: "high", label: "七日年化" }] : FACTORS;
    const ranges = {};
    for (const fac of active) {
      ranges[fac.key] = minMax(peers.map((f) => rawValue(f, fac.key)));
    }
    for (const f of peers) {
      const factors = active.map((fac) => {
        const raw = rawValue(f, fac.key);
        const { lo, hi } = ranges[fac.key];
        let s = 0.5;
        if (raw !== null && hi > lo) {
          s = (raw - lo) / (hi - lo);
          if (fac.better === "low") s = 1 - s;
        }
        return { key: fac.key, label: fac.label, weight: fac.weight, raw, score: s };
      });
      const total = factors.reduce((a, x) => a + x.score * x.weight, 0) * 100;
      scored.set(f.code, { total: Math.round(total * 10) / 10, factors });
    }
  }
  return scored;
}

/** 组合风险：用 波动率 × 相关系数矩阵 估算年化波动 */
function portfolioRisk(list, corr) {
  // list: [{code, weight}]
  const idx = new Map((corr?.order || []).map((c, i) => [c, i]));
  const n = corr?.order?.length || 0;
  let variance = 0;
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    const ia = idx.get(a.code);
    for (let j = 0; j < list.length; j++) {
      const b = list[j];
      const ib = idx.get(b.code);
      let rho = 0;
      if (ia !== undefined && ib !== undefined && n) rho = corr.matrix[ia * n + ib];
      else if (a.code === b.code) rho = 1;
      variance += a.weight * b.weight * (a.vol || 0) * (b.vol || 0) * rho;
    }
  }
  const vol = Math.sqrt(Math.max(0, variance));
  return {
    vol,
    estDrawdown: -1.55 * vol, // 经验系数：最大回撤≈1.55×年化波动，仅作量级参考
    effN: list.reduce((a, x) => a + x.weight * x.weight, 0) > 0 ? 1 / list.reduce((a, x) => a + x.weight * x.weight, 0) : 0,
  };
}

/**
 * 生成季度配置
 * @param {object} p
 * @param {Array} p.funds     基金池（data/funds.json 的 funds）
 * @param {object} p.corr     相关矩阵
 * @param {string} p.risk     conservative|steady|balanced|aggressive
 * @param {number} p.amount   计划投入总金额
 * @param {Array}  p.holdings [{code, amount}] 当前持仓（可选）
 */
function buildAllocation({ funds, corr, risk = "balanced", amount = 100000, holdings = [] }) {
  const profile = PROFILES[risk] || PROFILES.balanced;
  const scores = scoreFunds(funds);
  const byBucket = new Map();
  for (const f of funds) {
    if (!byBucket.has(f.bucket)) byBucket.set(f.bucket, []);
    byBucket.get(f.bucket).push({ ...f, score: scores.get(f.code)?.total ?? 0, factors: scores.get(f.code)?.factors || [] });
  }
  for (const arr of byBucket.values()) arr.sort((a, b) => b.score - a.score || a.code.localeCompare(b.code));

  // 目标权重：池子里没有的大类，权重按比例转给有货的大类
  const weights = { ...profile.targets };
  const missing = Object.keys(weights).filter((b) => !(byBucket.get(b)?.length));
  if (missing.length) {
    const lost = missing.reduce((a, b) => a + weights[b], 0);
    missing.forEach((b) => (weights[b] = 0));
    const rest = Object.keys(weights).filter((b) => weights[b] > 0);
    const restSum = rest.reduce((a, b) => a + weights[b], 0) || 1;
    rest.forEach((b) => (weights[b] += (lost * weights[b]) / restSum));
  }

  const softmaxSplit = (chosen, target, k, temp) => {
    if (!chosen.length) return [];
    const maxS = Math.max(...chosen.map((f) => f.score));
    let ws = chosen.map((f) => Math.exp((f.score - maxS) / temp));
    ws = ws.map((w) => w / ws.reduce((a, b) => a + b, 0));
    // 单只上限 35%，迭代归一
    for (let iter = 0; iter < 8; iter++) {
      const cap = k === 1 ? 1 : 0.35;
      ws = ws.map((w) => Math.min(w, cap));
      const sum = ws.reduce((a, b) => a + b, 0) || 1;
      ws = ws.map((w) => w / sum);
    }
    return chosen.map((f, i) => ({ ...f, weight: ws[i] * target }));
  };

  const picks = [];
  for (const [bucket, pool] of byBucket) {
    const target = weights[bucket] || 0;
    if (target <= 0 || !pool.length) continue;
    const k = Math.min(profile.perBucket[bucket] || 2, pool.length);
    const temp = bucket === "cash" ? 3 : 7;

    let allocated = [];
    const corePool = bucket === "equity" ? pool.filter((f) => f.tag === "core") : [];
    if (corePool.length >= 1 && profile.coreShare > 0 && pool.length > corePool.length) {
      // 核心-卫星：宽基打底，主动/主题做卫星，避免集中押注单一赛道
      const coreK = Math.min(2, corePool.length, k);
      const satK = Math.max(1, k - coreK);
      const coreW = target * profile.coreShare;
      allocated = [
        ...softmaxSplit(corePool.slice(0, coreK), coreW, coreK, temp),
        ...softmaxSplit(pool.filter((f) => f.tag !== "core").slice(0, satK), target - coreW, satK, temp),
      ];
    } else {
      allocated = softmaxSplit(pool.slice(0, k), target, k, temp);
    }

    for (const f of allocated) {
      picks.push({
        code: f.code, name: f.name, bucket, score: f.score, factors: f.factors,
        weight: f.weight, vol: f.vol3y, mdd: f.mdd3y, cagr: f.cagr3y,
        sharpe: f.sharpe3y, scale: f.scale, fee: f.feeRate, tag: f.tag || null,
      });
    }
  }

  // 去掉权重过小的碎仓（<1.5%），再归一，避免"每只买 800 元"式噪音
  const minWeight = amount < 20000 ? 0.06 : 0.015;
  let kept = picks.filter((p) => p.weight >= minWeight);
  const renorm = (arr) => {
    const s = arr.reduce((a, p) => a + p.weight, 0) || 1;
    arr.forEach((p) => (p.weight = p.weight / s));
  };
  renorm(kept);

  // 金额较小时，买不起的仓位直接砍掉（基金单笔常见门槛 10~100 元），
  // 否则会出现「目标 300 元 / 占比 0.0% / 买入」这种自相矛盾的行。
  const MIN_TICKET = 100;
  for (let iter = 0; iter < 8; iter++) {
    if (kept.length <= 1) break;
    const affordable = kept.filter((p) => p.weight * amount >= MIN_TICKET);
    if (affordable.length === kept.length) break;
    kept = affordable.length ? affordable : [kept.reduce((a, b) => (b.weight > a.weight ? b : a))];
    renorm(kept);
  }
  picks.length = 0;
  picks.push(...kept);

  // 金额取整到 100 元，并把误差补到最大的一笔
  for (const p of picks) p.amount = Math.max(MIN_TICKET, round100(p.weight * amount));
  if (picks.length) {
    let diff = amount - picks.reduce((a, p) => a + p.amount, 0);
    const biggest = picks.reduce((a, b) => (b.amount > a.amount ? b : a));
    biggest.amount += diff;
    // 极端小额（< 最小申购额）时全部给一只
    if (biggest.amount < MIN_TICKET) {
      picks.length = 0;
      picks.push({ ...kept[0], amount });
    }
  }

  const total = picks.reduce((a, p) => a + p.amount, 0) || 1;
  for (const p of picks) {
    p.weight = p.amount / total;
    p.current = holdings.find((h) => h.code === p.code)?.amount || 0;
    p.delta = p.amount - p.current;
    p.action = actionOf(p, amount);
  }

  // 已持有但本期不再入选的基金 → 建议清仓
  for (const h of holdings) {
    if (!h.amount) continue;
    if (picks.some((p) => p.code === h.code)) continue;
    const f = funds.find((x) => x.code === h.code);
    picks.push({
      code: h.code,
      name: f?.name || h.code,
      bucket: f?.bucket || "equity",
      score: scores.get(h.code)?.total ?? 0,
      factors: scores.get(h.code)?.factors || [],
      weight: 0,
      vol: f?.vol3y || 0,
      mdd: f?.mdd3y || 0,
      cagr: f?.cagr3y || 0,
      sharpe: f?.sharpe3y || 0,
      scale: f?.scale ?? null,
      fee: f?.feeRate ?? null,
      amount: 0,
      current: h.amount,
      delta: -h.amount,
      action: { key: "sell-all", label: "清仓", tone: "sell", note: "本期打分未进入配置" },
    });
  }

  picks.sort((a, b) => b.amount - a.amount);

  const riskInfo = portfolioRisk(
    picks.filter((p) => p.amount > 0).map((p) => ({ code: p.code, weight: p.weight, vol: p.vol })),
    corr
  );

  const bucketMix = {};
  for (const p of picks) bucketMix[p.bucket] = (bucketMix[p.bucket] || 0) + p.weight;

  const currentTotal = holdings.reduce((a, h) => a + h.amount, 0);
  const turnover = currentTotal > 0
    ? picks.reduce((a, p) => a + Math.abs(p.delta), 0) / 2 / Math.max(amount, currentTotal)
    : 1;

  return {
    risk: profile.key,
    profile,
    amount,
    picks,
    bucketMix,
    riskInfo,
    turnover,
    currentTotal,
    avgScore: picks.filter((p) => p.amount > 0).reduce((a, p) => a + p.score * p.weight, 0),
    notes: buildNotes({ picks, bucketMix, riskInfo, profile }),
  };
}

function actionOf(p, total = 100000) {
  const minTrade = Math.max(100, Math.round(total * 0.004));
  if (p.amount === 0 && p.current > 0) return { key: "sell-all", label: "清仓", tone: "sell", note: "移出配置" };
  if (p.current === 0) return { key: "buy", label: "买入", tone: "buy", note: "新建仓位" };
  const ratio = p.delta / p.current;
  if (p.delta > minTrade && ratio > 0.15) return { key: "add", label: "加仓", tone: "buy", note: `占比提升至 ${(p.weight * 100).toFixed(1)}%` };
  if (p.delta < -minTrade && ratio < -0.15) return { key: "trim", label: "减仓", tone: "sell", note: `占比降至 ${(p.weight * 100).toFixed(1)}%` };
  return { key: "hold", label: "持有", tone: "hold", note: "偏离在阈值内" };
}

function buildNotes({ picks, bucketMix, riskInfo, profile }) {
  const notes = [];
  const eq = (bucketMix.equity || 0) + (bucketMix.overseas || 0);
  notes.push(`权益类合计 ${(eq * 100).toFixed(0)}%，固收 ${((bucketMix.bond || 0) * 100).toFixed(0)}%，现金 ${((bucketMix.cash || 0) * 100).toFixed(0)}%。`);
  const top = picks.filter((p) => p.amount > 0).sort((a, b) => b.weight - a.weight)[0];
  if (top) notes.push(`第一大持仓 ${top.name} 占 ${(top.weight * 100).toFixed(0)}%，单只已做上限约束。`);
  if (riskInfo.vol > 0.22) notes.push(`组合估算年化波动 ${(riskInfo.vol * 100).toFixed(1)}%，偏高；若回撤超出承受范围请下调风险档。`);
  else notes.push(`组合估算年化波动 ${(riskInfo.vol * 100).toFixed(1)}%，与「${profile.name}」匹配度较好。`);
  if (riskInfo.effN < 4) notes.push(`分散度偏低（有效持仓数 ${riskInfo.effN.toFixed(1)}），建议关注相关性。`);
  return notes;
}

/* ---------------- 季度窗口 ---------------- */

function quarterOf(date = new Date()) {
  const d = new Date(date);
  const q = Math.floor(d.getMonth() / 3) + 1;
  return { key: `${d.getFullYear()}Q${q}`, year: d.getFullYear(), q };
}

const HOLIDAYS = new Set(["01-01", "10-01", "10-02", "10-03", "05-01"]);
function firstWeekdayOf(year, month) {
  const d = new Date(year, month, 1);
  const key = (x) => `${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  while (d.getDay() === 0 || d.getDay() === 6 || HOLIDAYS.has(key(d))) d.setDate(d.getDate() + 1);
  return d;
}

function nextQuarterStart(date = new Date()) {
  const d = new Date(date);
  const q = Math.floor(d.getMonth() / 3) + 1;
  const y = d.getFullYear();
  if (q === 4) return firstWeekdayOf(y + 1, 0);
  return firstWeekdayOf(y, q * 3);
}

function daysUntil(target, from = new Date()) {
  const a = new Date(from); a.setHours(0, 0, 0, 0);
  const b = new Date(target); b.setHours(0, 0, 0, 0);
  return Math.round((b - a) / 86400000);
}

/** 当前是否处于「可生成新报告」的窗口：本季度还没有报告即可生成 */
function canGenerate(currentKey, reports) {
  return !reports.some((r) => r.quarter === currentKey);
}

/* ---------------- 卖出与持有期 ---------------- */

// 场外基金常见的赎回费阶梯（占赎回金额比例），仅作估算，以基金合同为准
const FEE_TIERS = {
  equity: [[7, 0.015], [30, 0.0075], [365, 0.005], [730, 0.0025], [Infinity, 0]],
  overseas: [[7, 0.015], [30, 0.0075], [365, 0.005], [730, 0.0025], [Infinity, 0]],
  alt: [[7, 0.015], [30, 0.0075], [365, 0.005], [730, 0.0025], [Infinity, 0]],
  bond: [[7, 0.015], [30, 0.001], [Infinity, 0]],
  cash: [[Infinity, 0]],
};

function feeTier(days, bucket) {
  const tiers = FEE_TIERS[bucket] || FEE_TIERS.equity;
  for (const [limit, rate] of tiers) {
    if (days < limit) {
      const next = tiers.find(([d]) => d > limit);
      return { rate, limit, nextLimit: next ? next[0] : Infinity, nextRate: next ? next[1] : 0 };
    }
  }
  return { rate: 0, limit: Infinity, nextLimit: Infinity, nextRate: 0 };
}

const addDays = (d, n) => {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
};

function nextTradingDay(date) {
  const d = new Date(date);
  const HOL = new Set(["01-01", "10-01", "10-02", "10-03", "05-01"]);
  const key = (x) => `${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  while (d.getDay() === 0 || d.getDay() === 6 || HOL.has(key(d))) d.setDate(d.getDate() + 1);
  return d;
}

const fmtDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

/**
 * 卖出计划：什么时候卖、卖多少、赎回费多少、要不要为费率再等等
 * @param {object} p
 * @param {Array}  p.picks     本期配置（含 current / delta / amount）
 * @param {Array}  p.holdings  当前持仓（可带 since：买入日期）
 * @param {Date}   p.createdAt 报告生成时间
 */
function buildSellPlan({ picks, holdings = [], createdAt = new Date() }) {
  const today = new Date(createdAt);
  today.setHours(0, 0, 0, 0);
  const rows = [];

  for (const p of picks) {
    const sell = -p.delta;
    if (sell <= 0) continue;
    const hold = holdings.find((h) => h.code === p.code);
    const since = hold?.since ? new Date(hold.since) : null;
    const days = since && !Number.isNaN(since.getTime()) ? Math.floor((today - since) / 86400000) : null;
    const tier = feeTier(days == null ? 30 : Math.max(0, days), p.bucket);
    const feeRate = tier.rate;
    const fee = Math.round(sell * feeRate);

    let earliest = today;
    let window;
    if (days == null) {
      earliest = nextTradingDay(addDays(today, 1));
      window = "报告期内 1~3 个交易日（交易日 15:00 前提交）";
    } else if (days < 7) {
      earliest = nextTradingDay(addDays(since, 7));
      window = `等到 ${fmtDate(earliest)}（持有满 7 天）之后的首个交易日再提交，否则按 1.5% 收惩罚性赎回费`;
    } else {
      earliest = nextTradingDay(addDays(today, 1));
      window = `${fmtDate(earliest)} 起 3 个交易日内，15:00 前提交（15:00 后按下一交易日净值）`;
    }

    // 差几天就能降档时，提示等一下更划算
    let waitHint = null;
    if (days != null && tier.nextLimit !== Infinity && tier.nextLimit - days <= 10 && tier.nextRate < feeRate) {
      waitHint = `再持有 ${Math.ceil(tier.nextLimit - days)} 天，赎回费率从 ${(feeRate * 100).toFixed(2)}% 降到 ${(tier.nextRate * 100).toFixed(2)}%，可省约 ${Math.round(sell * (feeRate - tier.nextRate))} 元`;
      const waitDate = nextTradingDay(addDays(since, Math.ceil(tier.nextLimit - days)));
      if (waitDate < earliest) earliest = waitDate;
    }

    rows.push({
      code: p.code,
      name: p.name,
      bucket: p.bucket,
      amount: Math.round(sell),
      targetWeight: p.weight,
      holdingDays: days,
      feeRate,
      fee,
      earliest: fmtDate(earliest),
      window,
      waitHint,
      reason: p.amount === 0 ? "本期未入选，建议清仓" : "超出本期目标权重，减回目标",
    });
  }

  rows.sort((a, b) => b.amount - a.amount);
  return {
    generatedAt: new Date(createdAt).toISOString(),
    rows,
    total: rows.reduce((a, r) => a + r.amount, 0),
    feeTotal: rows.reduce((a, r) => a + r.fee, 0),
    checks: [
      "先看持有天数：不满 7 天卖出，多数基金收 1.5% 惩罚性赎回费，通常等满 7 天再卖更划算。",
      "交易日 15:00 前提交按当日净值确认，15:00 之后顺延到下一交易日。",
      "季度调仓只在换季那几天做，平时不因为短期涨跌卖；被剔除的基金一次卖完，减仓的分 1~2 笔。",
    ],
  };
}

/**
 * 换仓建议：本周该卖的那只 → 直接给出去哪一只。
 * 只处理「清仓」类（跌出本期配置），减仓属于控制权重，不需要替补。
 */
function proposeSwaps({ funds, corr, risk = "balanced", amount = 100000, holdings = [] }) {
  if (!holdings.length) return { rows: [], total: 0 };
  const alloc = buildAllocation({ funds, corr, risk, amount, holdings });
  const scores = scoreFunds(funds);
  const held = new Set(holdings.map((h) => h.code));
  const picked = new Map(alloc.picks.map((p) => [p.code, p]));
  const withScore = (f) => ({ ...f, score: scores.get(f.code)?.total ?? 0 });

  const rows = [];
  for (const p of alloc.picks) {
    if (p.amount > 0 || p.current <= 0) continue; // 只看清仓
    const money = p.current;

    // 1) 同类别里、没持有、本期也没配置的，打分最高的那只
    let cands = funds
      .filter((f) => f.bucket === p.bucket && !held.has(f.code) && !picked.has(f.code))
      .map(withScore)
      .sort((a, b) => b.score - a.score);

    // 2) 没有可用的，就并入本期同类别正在加仓的那只
    if (!cands.length) {
      const buying = alloc.picks
        .filter((x) => x.bucket === p.bucket && x.delta > 0)
        .sort((a, b) => b.delta - a.delta)[0];
      if (buying) {
        rows.push({
          sell: { code: p.code, name: p.name, amount: Math.round(money), score: p.score },
          buy: { code: buying.code, name: buying.name, score: buying.score, bucket: buying.bucket },
          amount: Math.round(money),
          merge: true,
          why: "同类别已有加仓标的，这笔钱直接并入",
        });
        continue;
      }
      // 3) 该类别清空时，退到固收
      cands = funds
        .filter((f) => f.bucket === "bond" && !held.has(f.code))
        .map(withScore)
        .sort((a, b) => b.score - a.score);
    }

    const buy = cands[0];
    if (!buy) continue;
    rows.push({
      sell: { code: p.code, name: p.name, amount: Math.round(money), score: p.score },
      buy: { code: buy.code, name: buy.name, score: buy.score, bucket: buy.bucket },
      amount: Math.round(money),
      merge: false,
      why: `${BUCKETS[buy.bucket]?.name || buy.bucket}里未持有、本期未配置的最高分（${buy.score.toFixed(1)} 分）`,
    });
  }

  // 同一只替补被推荐两次时合并成一笔，避免「卖两只、买同一只」出现两行
  const merged = new Map();
  for (const r of rows) {
    const key = r.buy.code;
    if (merged.has(key)) {
      const m = merged.get(key);
      m.amount += r.amount;
      m.sells.push(r.sell);
      m.why = `同类别最高分（${m.buy.score.toFixed(1)} 分），承接 ${m.sells.length} 只被剔除的基金`;
    } else {
      merged.set(key, { ...r, sells: [r.sell] });
    }
  }
  const out = [...merged.values()].sort((a, b) => b.amount - a.amount);
  return { rows: out, total: out.reduce((a, r) => a + r.amount, 0) };
}

/**
 * 从「日涨跌幅序列」算风险指标，浏览器和 Node 共用。
 * points: [{ date: 'YYYY-MM-DD', nav: number, ret: number }]（ret 是日涨跌幅，小数）
 */
function metricsFromNav(points) {
  const pts = points.filter((p) => p && p.nav > 0 && Number.isFinite(p.ret));
  const n = pts.length - 1;
  if (n < 30) return null;

  const idx = [100];
  for (let i = 0; i < n; i++) idx.push(idx[i] * (1 + pts[i + 1].ret));

  const win = (k) => Math.min(k, n);
  const cum = (k) => {
    const kk = Math.min(k, n);
    return idx[n] / idx[n - kk] - 1;
  };
  const rets = pts.slice(1).map((p) => p.ret);
  const annVol = (k) => {
    const w = rets.slice(n - win(k));
    const mu = w.reduce((a, b) => a + b, 0) / w.length;
    const v = w.reduce((a, b) => a + (b - mu) ** 2, 0) / Math.max(1, w.length - 1);
    return Math.sqrt(v * 252);
  };
  const mdd = (k) => {
    const w = idx.slice(Math.max(0, idx.length - 1 - win(k)));
    let peak = w[0], dd = 0;
    for (const v of w) { peak = Math.max(peak, v); dd = Math.min(dd, v / peak - 1); }
    return dd;
  };
  const annual = (c, k) => (k >= 240 ? Math.pow(1 + c, 252 / k) - 1 : c);

  const r1y = cum(252), r3y = cum(756);
  const vol3y = annVol(756), vol1y = annVol(252), mdd3y = mdd(756);
  const cagr3y = annual(r3y, win(756));
  return {
    start: pts[0].date, end: pts[pts.length - 1].date, days: pts.length,
    r3m: cum(63), r6m: cum(126), r1y, r3y, cagr3y,
    vol1y, vol3y, mdd3y,
    sharpe3y: vol3y > 1e-6 ? (cagr3y - 0.02) / vol3y : 0,
    calmar3y: mdd3y < -1e-6 ? cagr3y / Math.abs(mdd3y) : 0,
  };
}


/**
 * 纯前端实时数据：不依赖后端，用 <script> 标签绕开 CORS。
 *  - 估值：fundgz 的 JSONP（jsonpgz(...)），每只 ~200 字节，全池 36 只也就几 KB
 *  - 历史净值：pingzhongdata 的 JS（var Data_netWorthTrend = [...]），每只 ~700KB，只在需要时拉
 */
const loadScript = (src, timeout = 15000) =>
  new Promise((resolve, reject) => {
    const s = document.createElement("script");
    let done = false;
    const finish = (err) => {
      if (done) return;
      done = true;
      s.remove();
      err ? reject(err) : resolve();
    };
    s.src = src;
    s.async = true;
    s.onload = () => finish();
    s.onerror = () => finish(new Error("加载失败"));
    document.head.appendChild(s);
    setTimeout(() => finish(new Error("超时")), timeout);
  });

/** 批量取实时估值（串行，因为接口固定回调名 jsonpgz） */
async function fetchEstimates(codes, { onProgress, maxFailStreak = 5 } = {}) {
  const out = {};
  let failStreak = 0;
  for (let i = 0; i < codes.length; i++) {
    const code = codes[i];
    try {
      await new Promise((resolve, reject) => {
        const prev = window.jsonpgz;
        let done = false;
        const finish = (d) => {
          if (done) return;
          done = true;
          window.jsonpgz = prev;
          d ? resolve(d) : reject(new Error("空数据"));
        };
        window.jsonpgz = (d) => finish(d);
        loadScript(`https://fundgz.1234567.com.cn/js/${code}.js?rt=${Date.now()}`, 8000)
          .then(() => setTimeout(() => finish(null), 0))
          .catch(() => finish(null));
        setTimeout(() => finish(null), 8500);
      }).then((d) => {
        if (d && d.fundcode) {
          out[code] = { nav: Number(d.dwjz), est: Number(d.gsz), chg: Number(d.gszzl) / 100, at: d.gztime };
          failStreak = 0;
        } else if (++failStreak >= maxFailStreak) {
          throw new Error("接口连续失败");
        }
      });
    } catch (e) {
      if (/连续失败/.test(e.message)) break; // 接口整体不可用，不再重试
    }
    onProgress?.(i + 1, codes.length);
  }
  return out;
}

/** 取一只基金的历史净值（pingzhongdata），转成引擎要的 points */
async function fetchHistory(code) {
  const src = `https://fund.eastmoney.com/pingzhongdata/${code}.js?rt=${Date.now()}`;

}

function applyHistory(fund, points) {

}

const DEFAULT_API = "https://jice-api-vykwfsvjgb.cn-hongkong.fcapp.run";

const apiBase = () => {

// 每台设备一个 id：持仓/提醒/订阅都按它隔离，互不干扰
function deviceId() {
  let v = store.get("qfa.device");
  if (!v) {
    const rnd = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36) + Date.now().toString(36);
    v = String(rnd).replace(/[^a-zA-Z0-9]/g, "").slice(0, 20) || "dev" + Date.now().toString(36);
    store.set("qfa.device", v);
  }
  return v;
}
// 另一端（本地 ↔ 云端）的地址，用于同步绑定
const otherBase = () => {

  // 本地页面 → 云端；网页 → 同机的本地服务（127.0.0.1 属可信来源，HTTPS 页面也能连）

async function syncState() {

}

// 打开页面时拉两端，取 updatedAt 较新的那份，并回写两端
async function pullMergeState() {
  const id = encodeURIComponent(deviceId());
  const grab = async (base) => {
    try {
      const r = await fetch(`${base}/api/state?d=${id}`, { cache: "no-store" });
      return r.ok ? await r.json() : null;
    } catch { return null; }
  };
  const cur = await grab(apiBase());
  const ob = otherBase();
  const other = ob ? await grab(ob) : null;
  if (!cur && !other) return;
  const newer = (a, b) => {
    if (!a) return b;
    if (!b) return a;
    return new Date(a.updatedAt || 0) >= new Date(b.updatedAt || 0) ? a : b;
  };
  const best = newer(cur, other);
  if (!best || !Array.isArray(best.holdings)) return;
  const same = JSON.stringify(best.holdings) === JSON.stringify(state.holdings);
  if (!same) {
    state.holdings = best.holdings;
    if (best.amount) state.amount = best.amount;
    if (best.risk && PROFILES[best.risk]) state.risk = best.risk;
    store.set(LS, JSON.stringify(state));
    render();
  }
  await syncState(); // 回写两端，保持一致
}

  insertStaleBanner(main);
  $$("[data-amt]").forEach((b) =>
    b.addEventListener("click", () => {
      state.amount = Number(b.dataset.amt);
      saveState();
      renderPlan();
    })
  );
  $("#genInline")?.addEventListener("click", () => generate());
  $("#previewInline")?.addEventListener("click", () => generate({ preview: true }));
}

// 后台每天自动卖出的基金，同步到本地持仓（幂等：本地已没有这只就跳过）
const SEEN_KEY = "qfa.seenActions";
function seenActions() {
  try { return new Set(JSON.parse(store.get(SEEN_KEY) || "[]")); } catch { return new Set(); }
}
function markSeen(set) {
  store.set(SEEN_KEY, JSON.stringify([...set].slice(-80)));
}

function applyAutoActions() {
  const actions = ui.alerts?.actions || [];
  if (!actions.length) return;
  const seen = seenActions();
  let touched = 0;
  for (const a of actions) {
    if (seen.has(a.id)) continue;
    seen.add(a.id);
    const local = state.holdings.some((h) => h.code === a.sold.code);
    if (!local) continue; // 后台已经改过，或本来就没持有
    state.holdings = state.holdings.filter((h) => h.code !== a.sold.code);
    const ex = state.holdings.find((h) => h.code === a.bought.code);
    if (ex) ex.amount += a.bought.amount;
    else state.holdings.push({ code: a.bought.code, amount: a.bought.amount, since: a.at.slice(0, 10) });
    touched++;
  }
  markSeen(seen);
  if (touched) {
    saveState();
    toast(`后台已自动换仓 ${touched} 笔，持仓已同步`);
  }
}

// 打开页面时如果盯盘结果超过 12 小时，后台补跑一次（服务重启后也能自愈）
async function autoWatchIfStale() {
  if (OFFLINE || !state.holdings.length) return;
  const ts = ui.alerts?.generatedAt ? new Date(ui.alerts.generatedAt).getTime() : 0;
  if (Date.now() - ts < 12 * 3600e3) return;
  try {
    await fetch(api("/api/watch"), { method: "POST" });
  } catch {
    return;
  }
  for (let i = 0; i < 40; i++) {
    await new Promise((r) => setTimeout(r, 3000));
    const st = await (await fetch(api("/api/status"), { cache: "no-store" })).json();
    if (!st.watch?.running) break;
  }
  try {
    const a = await (await fetch(api("/api/alerts"), { cache: "no-store" })).json();
    if (a.items?.length) {
      ui.alerts = a;
      renderPlan();
    }
  } catch {
    /* ignore */
  }
}

async function checkNow() {
  if (OFFLINE) return offlineHint("检查持仓");
  if (!(await recheckBackend())) return offlineHint("检查持仓");
  const btn = $("#checkNow");
  if (btn) { btn.disabled = true; btn.textContent = "检查中…"; }
  try {
    const start = await fetch(api("/api/watch"), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ holdings: state.holdings, wxKey: store.get("qfa.wx") || "" }),
    });
    if (!start.ok) throw new Error(`后台没有响应（HTTP ${start.status}）`);
    const first = await start.json().catch(() => ({}));
    // 云端（Worker）是同步计算，响应里直接带结果，不用轮询
    if (typeof first.checked === "number") {
      ui.alerts = { generatedAt: first.generatedAt, checked: first.checked, items: first.items || [], actions: [] };
      renderPlan();
      toast(first.items?.length ? `发现 ${first.items.length} 只需要处理` : `检查完成：${first.checked} 只持仓暂时没有走坏`);
      return;
    }
    for (let i = 0; i < 60; i++) {
      await new Promise((r) => setTimeout(r, 1500));
      const sr = await fetch(api("/api/status"), { cache: "no-store" });
      if (!sr.ok) throw new Error("读不到后台状态");
      const st = await sr.json();
      if (!st.watch?.running) {
        const alerts = await (await fetch(api("/api/alerts"), { cache: "no-store" })).json();
        ui.alerts = alerts;
        renderPlan();
        toast(alerts.items?.length ? `发现 ${alerts.items.length} 只需要处理` : "检查完成，持仓暂时没有走坏");
        return;
      }
    }
    toast("检查超时，稍后再试");
  } catch (e) {
    toast("检查失败：" + friendlyErr(e));
  } finally {
    const b = $("#checkNow");
    if (b) { b.disabled = false; b.textContent = "检查持仓（每日盯盘）"; }
  }
}

function insertAlertCard(root) {
  const a = ui.alerts;
  if (!a?.items?.length) return;
  const undone = undoneIds();
  const recent = (a.actions || [])
    .filter((x) => Date.now() - new Date(x.at).getTime() < 7 * 864e5)
    .slice(-5)
    .reverse();
  const pending = a.items.filter((i) => !i.executed);
  const done = a.items.filter((i) => i.executed);
  if (!pending.length && !recent.length) return;

  const high = pending.filter((x) => x.level === "high" || x.level === "confirmed");
  root.insertAdjacentHTML(
    "afterbegin",
    `<div class="card alert-card" id="alertCard">
      <h3>卖出提醒
        <span class="hint">每日 08:30 自动盯盘 · ${a.generatedAt ? timeCN(a.generatedAt) : ""} · 检查了 ${a.checked} 只</span>
      </h3>
      <p class="swap-lead">大跌或波动剧烈（≥2.2 倍）直接建议卖出；只是轻微走弱的先进观察期，连续 ${"3"} 个交易日都触发才确认卖出，避免小波动就喊卖。</p>

      ${recent.length ? `<div class="auto-box">
        <div class="auto-title">已自动换仓 ${recent.filter((x) => !undone.has(x.id)).length} 笔</div>
        ${recent.map((x) => `<div class="auto-row ${undone.has(x.id) ? "undone" : ""}">
          <span class="auto-time">${timeCN(x.at)}</span>
          <span class="auto-body">卖出 <b>${esc(x.sold.code)}</b> ${fmt(x.sold.amount)} 元 → 买入 <b>${esc(x.bought.name)}</b>
            <span class="fcode">${x.scoreFrom} → ${x.scoreTo} 分</span></span>
          ${undone.has(x.id)
            ? `<span class="fcode">已撤销</span>`
            : `<button class="link-btn" data-undo="${x.id}">撤销</button>`}
        </div>`).join("")}
      </div>` : ""}

      ${pending.length
        ? pending.map((it) => `
        <div class="alert-row">
          <div class="alert-head">
            <span class="badge ${it.level === "watch" ? "amber" : "red"}">${it.level === "high" ? "建议卖出" : it.level === "confirmed" ? "观察确认" : "观察中"}</span>
            <b>${esc(it.name)}</b>
            <span class="fcode">${esc(it.code)} · ${fmt(it.amount)} 元 · 综合分 ${it.score ?? "—"}${it.observe ? ` · 连续 ${it.observe.days}/${it.observe.need} 天` : ""}</span>
          </div>
          <ul class="alert-hits">${it.hits.map((h) => `<li>${esc(h.text)}</li>`).join("")}</ul>
          ${it.replacement
            ? `<div class="alert-swap">→ 可以换到 <b>${esc(it.replacement.name)}</b>（${it.replacement.score} 分，高 ${it.replacement.gain} 分）</div>`
            : `<div class="alert-swap muted">${esc(it.note || "同类里没有明显更好的替代，先只提示")}</div>`}
        </div>`).join("")
        : `<p class="hold-empty">${done.length ? "需要处理的都已自动执行，没有待人工确认的卖出。" : ""}</p>`}

      <div class="btn-row" style="margin-top:12px">
        ${pending.filter((x) => (x.level === "high" || x.level === "confirmed") && x.replacement).length ? `<button class="btn" style="width:auto;padding:9px 16px" id="applyAlert">按建议换仓</button>` : ""}
        <button class="btn ghost" id="dismissAlert">我知道了</button>
      </div>
      <p class="welcome-note">每天 08:00 刷新净值、08:30 检查并自动换仓；改了持仓后也会重新检查。</p>
    </div>`
  );

  $$("[data-undo]").forEach((btn) =>
    btn.addEventListener("click", () => {
      const act = (ui.alerts.actions || []).find((x) => x.id === btn.dataset.undo);
      if (!act) return;
      const b = state.holdings.find((h) => h.code === act.bought.code);
      if (b) {
        b.amount -= act.bought.amount;
        if (b.amount <= 0) state.holdings = state.holdings.filter((h) => h !== b);
      }
      const ex = state.holdings.find((h) => h.code === act.sold.code);
      if (ex) ex.amount += act.sold.amount;
      else state.holdings.push({ code: act.sold.code, amount: act.sold.amount, since: act.sold.since });
      const set = undoneIds();
      set.add(act.id);
      store.set("qfa.undone", JSON.stringify([...set]));
      saveState();
      renderPlan();
      toast("已撤销这笔换仓");
    })
  );

  $("#dismissAlert").addEventListener("click", () => {
    ui.alerts = null;
    $("#alertCard")?.remove();
  });
  $("#applyAlert")?.addEventListener("click", () => {

      state.holdings = state.holdings.filter((h) => h.code !== it.code);

      if (ex) ex.amount += it.amount;
      else state.holdings.push({ code: it.replacement.code, amount: it.amount, since: today });
      moved += it.amount;
    }
    saveState();
    ui.alerts = null;
    renderPlan();
    toast(moved ? `已换仓 ${fmt(moved)} 元，记得点「重新生成」同步报告` : "没有可执行的换仓");
  });
}

async function refreshData() {
  if (OFFLINE || hasBackend === false) return offlineHint("刷新净值");
  const btn = $("#refreshBtn");
  if (btn) { btn.disabled = true; btn.textContent = "抓取中…（约 1 分钟）"; }
  try {
    const r = await fetch(api("/api/refresh"), { method: "POST" });
    if (!r.ok) throw new Error("服务端没有刷新接口，请在终端执行 npm run refresh");
    for (let i = 0; i < 120; i++) {
      await new Promise((res) => setTimeout(res, 2000));
      const sr = await fetch(api("/api/status"));
      if (!sr.ok) throw new Error("读不到后台状态");
      const st = await sr.json();
      if (!st.refresh?.running) {
        if (st.ok) { toast("净值已更新，正在重新加载"); setTimeout(() => location.reload(), 600); return; }
        throw new Error(st.message || "抓取失败");
      }
      if (btn) btn.textContent = `抓取中… ${Math.round((i * 2 + 2) / 60 * 100) / 100} 分钟`;
    }
    throw new Error("超时，请在终端执行 npm run refresh");
  } catch (e) {
    toast("刷新失败：" + friendlyErr(e));
    if (btn) { btn.disabled = false; btn.textContent = "刷新净值"; }
  }
}

  // 事件委托：列表是动态渲染的，不能只绑一次
  $("#wxStats")?.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-unwx]");
    if (btn) unwxBind(btn.dataset.unwx);
  });
  if ($("#syncCode")) $("#syncCode").placeholder = `同步码：当前 ${deviceId()}`;
  $("#addHold")?.addEventListener("click", () => {
    const used = new Set(state.holdings.map((h) => h.code));
    const pick = DATA.funds.find((f) => !used.has(f.code));
    if (!pick) return;
    state.holdings.push({ code: pick.code, amount: 0 });
    saveState();
    renderPlan();
  });
}

function renderHoldings() {
  const box = $("#holdList");
  if (!box) return;
  if (!state.holdings.length) {
    box.innerHTML = `<div class="hold-empty">还没有填写持仓，按空仓建仓计算。</div>`;
    return;
  }
  box.innerHTML = state.holdings
    .map(
      (h, i) => `<div class="hold-item">
        <div class="hold-row">
          <select data-hold-code="${i}">
            ${DATA.funds
              .map((f) => `<option value="${f.code}" ${f.code === h.code ? "selected" : ""}>${esc(f.name)}</option>`)
              .join("")}
          </select>
          <input type="number" min="0" step="1000" value="${h.amount || 0}" data-hold-amount="${i}" />
          <button data-hold-del="${i}" title="删除">×</button>
        </div>
        <div class="hold-meta">
          <label for="since-${i}">买入日期</label>
          <input type="date" id="since-${i}" data-hold-since="${i}" value="${h.since || ""}" />
          <span>${h.since ? `持有 ${Math.max(0, Math.floor((Date.now() - new Date(h.since)) / 86400000))} 天` : "填了才能算赎回费"}</span>
        </div>
      </div>`
    )
    .join("");

  $$("[data-hold-code]").forEach((el) =>
    el.addEventListener("change", (e) => {
      const i = Number(e.target.dataset.holdCode);
      state.holdings[i].code = e.target.value;
      saveState();
      renderPlan();
    })
  );
  $$("[data-hold-amount]").forEach((el) =>
    el.addEventListener("input", (e) => {
      const i = Number(e.target.dataset.holdAmount);
      state.holdings[i].amount = Math.max(0, Number(e.target.value) || 0);
      saveState();
    })
  );
  $$("[data-hold-since]").forEach((el) =>
    el.addEventListener("change", (e) => {
      const i = Number(e.target.dataset.holdSince);
      state.holdings[i].since = e.target.value || undefined;
      saveState();
      renderPlan();
    })
  );
  $$("[data-hold-del]").forEach((el) =>
    el.addEventListener("click", (e) => {
      const i = Number(e.target.dataset.holdDel);
      state.holdings.splice(i, 1);
      saveState();
      renderPlan();
    })
  );
}

/* ---------------- 生成 ---------------- */

function generate({ preview = false } = {}) {
  if (!DATA) return;
  const q = currentQuarter();
  const alloc = buildAllocation({
    funds: DATA.funds,
    corr: DATA.corr,
    risk: state.risk,
    amount: state.amount,
    holdings: state.holdings,
  });

  const sellPlan = buildSellPlan({
    picks: alloc.picks,
    holdings: state.holdings,
    createdAt: new Date(),
  });

  const swaps = proposeSwaps({
    funds: DATA.funds, corr: DATA.corr, risk: state.risk,
    amount: state.amount, holdings: state.holdings,
  });

  const report = {
    id: `${q.key}-${Date.now()}`,
    quarter: q.key,
    createdAt: new Date().toISOString(),
    asOf: DATA.asOf,
    risk: state.risk,
    amount: state.amount,
    holdingsSnapshot: state.holdings.map((h) => ({ ...h })),
    picks: alloc.picks.map((p) => ({
      code: p.code, name: p.name, bucket: p.bucket, tag: p.tag,
      weight: p.weight, amount: p.amount, current: p.current, delta: p.delta,
      action: p.action, score: p.score, factors: p.factors,
      vol: p.vol, mdd: p.mdd, cagr: p.cagr, sharpe: p.sharpe, scale: p.scale, fee: p.fee,
    })),
    bucketMix: alloc.bucketMix,
    riskInfo: alloc.riskInfo,
    turnover: alloc.turnover,
    notes: alloc.notes,
    sellPlan,
    swaps,
  };

  if (preview) {
    ui.preview = { ...report, preview: true };
    toast("已生成预览，不会写入历史");
    renderPlan();
    if (window.innerWidth < 980) setTimeout(scrollToReport, 260);
    return;
  } else {
    const idx = state.reports.findIndex((r) => r.quarter === q.key);
    if (idx >= 0) state.reports[idx] = report;
    else state.reports.unshift(report);
    state.reports.sort((a, b) => b.quarter.localeCompare(a.quarter));
    saveState();
    ui.preview = null;
    toast(`${q.key} 配置已生成并锁定`);
  }
  renderPlan();
  // 窄屏下控件在上、报告在下，生成后直接把结果滚到眼前
  if (window.innerWidth < 980) setTimeout(scrollToReport, 260);
}

  return BUCKET_ORDER.filter((b) => (mix[b] || 0) > 0.004)

    .join("");
}

const REASON_LABEL = {
  mdd3y: "回撤小",
  sharpe3y: "性价比高",
  cagr3y: "长期收益好",
  vol3y: "波动低",
  feeRate: "费率低",
  r1y: "近一年强",
  scaleFit: "规模适中",
  managerYears: "经理稳定",
};

function reasonTags(pick) {
  if (!pick?.factors?.length) return "";
  const tags = [...pick.factors]
    .filter((f) => f.score >= 0.6)
    .sort((a, b) => b.score * b.weight - a.score * a.weight)
    .slice(0, 2)
    .map((f) => REASON_LABEL[f.key] || f.label);
  if (pick.tag === "core" && pick.bucket === "equity") tags.unshift("宽基打底");
  if (!tags.length) return "";
  return `<div class="reasons">${tags.slice(0, 3).map((t) => `<span>${esc(t)}</span>`).join("")}</div>`;
}

function plainConclusion(r) {
  const p = PROFILES[r.risk] || PROFILES.balanced;
  const buys = r.picks.filter((x) => x.amount > 0);
  const sells = r.picks.filter((x) => x.delta < 0);
  const parts = [];
  parts.push(`这期用 <b>${fmt(r.amount)} 元</b>买 <b>${buys.length} 只</b>基金：`);
  const mix = BUCKET_ORDER.filter((b) => (r.bucketMix[b] || 0) > 0.004)
    .sort((a, b) => r.bucketMix[b] - r.bucketMix[a])
    .map((b) => `${BUCKETS[b].name} ${pct(r.bucketMix[b], 0)}`);
  parts.push(mix.join("、") + "。");

  const dd = Math.abs(r.riskInfo.estDrawdown) * r.amount;
  parts.push(
    `按模型估算，一年里正常波动大约 ±${pct(r.riskInfo.vol)}；` +
      `真遇到极端行情，浮亏可能到 ${fmt(dd)} 元左右——这就是「${p.name}」要承受的代价。`
  );
  if (sells.length) {
    parts.push(`另外要卖出 ${sells.length} 只（约 ${fmt(sells.reduce((a, x) => a + Math.max(0, -x.delta), 0))} 元），具体看下面的卖出表。`);
  } else if (!r.currentTotal) {
    parts.push("你现在是空仓，照着下面的金额建仓就行，本期没有要卖的。");
  } else {
    parts.push("你的持仓和这期目标差不多，不用动。");
  }
  return parts.join("");
}

async function copyOrders(r) {
  const buys = r.picks.filter((x) => x.amount > 0);
  const sells = r.picks.filter((x) => x.delta < 0);
  const lines = [`季策 ${r.quarter} 买入清单（合计 ${fmt(r.amount)} 元）`];
  buys.forEach((x, i) => lines.push(`${i + 1}. ${x.name}（${x.code}） ${fmt(x.amount)} 元`));
  if (sells.length) {
    lines.push("", "卖出：");
    sells.forEach((x) => lines.push(`· ${x.name}（${x.code}） ${fmt(-x.delta)} 元`));
  }
  lines.push("", "支付宝 → 搜索 6 位代码 → 输入金额 → 交易日 15:00 前确认。");
  try {
    await navigator.clipboard.writeText(lines.join("\n"));
    toast("买入清单已复制，可直接粘到备忘录");
  } catch {
    toast("复制失败，请长按选择文本");
  }
}

function paintPoolTable() {
  const cols = [
    { key: "name", label: "基金" },
    { key: "bucket", label: "类别" },
    { key: "estChg", label: "今日", num: true, cls: "c-est" },
    { key: "cagr3y", label: "近3年年化", num: true },
    { key: "mdd3y", label: "最大回撤", num: true },
    { key: "vol3y", label: "年化波动", num: true, cls: "c-vol" },
    { key: "sharpe3y", label: "夏普", num: true, cls: "c-sharpe" },
    { key: "scale", label: "规模(亿)", num: true, cls: "c-scale" },
    { key: "score", label: "综合分", num: true },
  ];

  let rows = DATA.funds.filter((f) => {
    if (ui.bucket !== "all" && f.bucket !== ui.bucket) return false;
    if (!ui.q) return true;
    const q = ui.q.toLowerCase();
    return f.name.toLowerCase().includes(q) || f.code.includes(q);
  });
  rows = rows.map((f) => ({ ...f, score: SCORES.get(f.code)?.total ?? 0 }));

  const { key, dir } = ui.sort;
  const sign = dir === "asc" ? 1 : -1;
  rows.sort((a, b) => {
    if (key === "name") return a.name.localeCompare(b.name, "zh") * sign;
    if (key === "bucket") return BUCKET_ORDER.indexOf(a.bucket) - BUCKET_ORDER.indexOf(b.bucket) || b.score - a.score;
    return ((a[key] ?? 0) - (b[key] ?? 0)) * sign;
  });

  $("#poolTable").innerHTML = `
    <div class="tablewrap">
      <table class="grid">
        <thead><tr>
          ${cols.map((c) => `<th class="sortable ${c.num ? "num" : ""} ${c.cls || ""} ${ui.sort.key === c.key ? ui.sort.dir : ""}"
            data-sort="${c.key}" style="${c.num ? "text-align:right" : ""}">${c.label}</th>`).join("")}
        </tr></thead>
        <tbody>
          ${rows.map((f) => `
            <tr data-code="${esc(f.code)}" style="cursor:pointer">
              <td><div class="fname">${esc(f.name)}</div><div class="fcode">${esc(f.code)}${f.tag === "core" ? " · 核心" : ""}</div></td>
              <td><span class="mix-pill"><i style="width:6px;height:6px;border-radius:2px;background:${BUCKETS[f.bucket].color}"></i>${BUCKETS[f.bucket].name}</span></td>
              <td class="num c-est" style="color:${(DATA.estimates?.[f.code]?.chg ?? 0) >= 0 ? "var(--buy)" : "var(--sell)"}">${DATA.estimates?.[f.code] ? pct(DATA.estimates[f.code].chg, 2) : "—"}</td>
              <td class="num">${pct(f.cagr3y)}</td>
              <td class="num">${pct(f.mdd3y)}</td>
              <td class="num c-vol">${pct(f.vol3y)}</td>
              <td class="num c-sharpe">${f.sharpe3y.toFixed(2)}</td>
              <td class="num c-scale">${f.scale ? f.scale.toFixed(0) : "—"}</td>
              <td class="num">
                <span class="wbar"><i style="width:${Math.max(3, f.score)}%"></i></span>
                <span style="margin-left:6px">${f.score.toFixed(1)}</span>
              </td>
            </tr>`).join("") || `<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:26px">没有匹配的基金</td></tr>`}
        </tbody>
      </table>
    </div>`;

  $$("[data-sort]").forEach((th) =>
    th.addEventListener("click", () => {
      const k = th.dataset.sort;
      if (ui.sort.key === k) ui.sort.dir = ui.sort.dir === "desc" ? "asc" : "desc";
      else ui.sort = { key: k, dir: k === "name" ? "asc" : "desc" };
      paintPoolTable();
    })
  );
  $$("#poolTable tbody tr[data-code]").forEach((tr) =>
    tr.addEventListener("click", () => openFundDrawer(tr.dataset.code))
  );
}

    if (v6.length) lines.push(`另一台也在移动网络时，试 IPv6：<br/>${v6.slice(0, 2).map((ip) => `<b style="font-family:var(--mono);font-size:12px">http://[${ip}]:${st.port}</b>`).join("<br/>")}<br/><span style="color:#8a5a12">运营商常拦入站，打不开就用 Wi-Fi 或单文件版。</span>`);
    if (!lan.length) lines.push("现在这台走的是移动网络，没有局域网地址。连上 Wi-Fi（或开热点让另一台连过来）后刷新本页，就会出现局域网地址。");
    box.innerHTML = lines.join("<hr style='border:0;border-top:1px dashed #d9d3c4;margin:8px 0'/>");

  }
}

function reportMarkdown(r) {
  const p = PROFILES[r.risk] || PROFILES.balanced;
  const lines = [];
  lines.push(`# 季策 · ${r.quarter} 基金配置建议`, "");
  lines.push(`- 风险档：${p.name}（${p.desc}）`);
  lines.push(`- 计划投入：${fmt(r.amount)} 元`);
  lines.push(`- 净值基准：${r.asOf || DATA.asOf}`);
  lines.push(`- 生成时间：${timeCN(r.createdAt)}`);
  lines.push(`- 估算年化波动：${pct(r.riskInfo.vol)}；估算最大回撤：${pct(r.riskInfo.estDrawdown, 0)}；有效持仓数：${r.riskInfo.effN.toFixed(1)}`, "");
  lines.push("## 大类配比", "", "| 大类 | 占比 |", "|---|---|");
  for (const b of BUCKET_ORDER) if ((r.bucketMix[b] || 0) > 0) lines.push(`| ${BUCKETS[b].name} | ${pct(r.bucketMix[b])} |`);
  lines.push("", "## 目标配置", "", "| 基金 | 代码 | 类别 | 目标占比 | 目标金额 | 当前 | 差额 | 操作 | 综合分 |", "|---|---|---|---|---|---|---|---|---|");
  for (const x of r.picks) {
    lines.push(`| ${x.name} | ${x.code} | ${BUCKETS[x.bucket].name} | ${pct(x.weight)} | ${x.amount ? fmt(x.amount) : "—"} | ${x.current ? fmt(x.current) : "—"} | ${x.delta ? signed(x.delta) : "—"} | ${x.action.label} | ${x.score.toFixed(1)} |`);
  }
  lines.push("", "## 说明", "");
  for (const n of r.notes) lines.push(`- ${n}`);
  lines.push("", "> 本报告由规则化模型自动生成，仅供参考，不构成投资建议。基金有风险，投资需谨慎。");
  lines.push(">");
  lines.push("> 做者：杰杰");
  return lines.join("\n");
}

function download(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function downloadMarkdown(r) {
  download(`季策-${r.quarter}-配置建议.md`, reportMarkdown(r), "text/markdown;charset=utf-8");
  toast("已导出 Markdown");
}

function icsDate(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getUTCFullYear()}${p(d.getUTCMonth() + 1)}${p(d.getUTCDate())}T${p(d.getUTCHours())}${p(d.getUTCMinutes())}00Z`;
}

function downloadIcs(r) {
  // 下一次提醒：下一季度首个交易日 09:30（UTC 01:30），之后每 3 个月重复
  const next = nextQuarterStart(new Date(r.createdAt));
  next.setHours(9, 30, 0, 0);
  const end = new Date(next.getTime() + 30 * 60000);
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//JiCe//Fund Quarter//CN", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    `UID:jice-${r.quarter}-${Date.now()}@local`,
    `DTSTAMP:${icsDate(new Date())}`,

const NOTIFY_KEY = "qfa.notified.v1";

function notifySupported() {
  // 注意：某些 WebView 里 Notification 存在但为 undefined，只判断 "in window" 会炸
  return typeof window !== "undefined" && typeof window.Notification === "function" && "requestPermission" in window.Notification;
}

function notifyGranted() {
  return notifySupported() && window.Notification.permission === "granted";
}

const b64ToU8 = (str) => {
  const pad = "=".repeat((4 - (str.length % 4)) % 4);
  const raw = atob((str + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
};

// 服务端推送订阅：需要 API 基址（本地服务）+ 浏览器支持 Push
async function reportDiag(stage, msg) {
  try {
    const base = apiBase();
    if (!base) return;
    await fetch(api("/api/diag"), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ stage, msg: String(msg || "").slice(0, 300), ua: navigator.userAgent }),
    });
  } catch { /* 上报失败不影响主流程 */ }
}

async function ensurePushSubscription() {
  if (!("serviceWorker" in navigator)) { reportDiag("check", "no serviceWorker"); return { ok: false, error: "这个浏览器没有 Service Worker" }; }
  if (!("PushManager" in window)) { reportDiag("check", "no PushManager"); return { ok: false, error: "这个浏览器没有 Push API" }; }
  const base = apiBase();
  if (!base) return { ok: false, error: "没有后端地址" };
  try {
    let reg = null;
    try { reg = await navigator.serviceWorker.ready; } catch (e) { reportDiag("sw-ready", e.message); reg = await navigator.serviceWorker.register("./sw.js"); }
    if (!reg?.pushManager) { reportDiag("sw", "no pushManager on registration"); return { ok: false, error: "Service Worker 不支持推送" }; }
    await reg.update?.();
    const kr = await fetch(api("/api/push/key"), { cache: "no-store" });
    if (!kr.ok) return { ok: false, error: `取公钥失败 HTTP ${kr.status}` };
    const { publicKey } = await kr.json();
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      try {
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(publicKey) });
      } catch (e) {
        reportDiag("subscribe", e.message || String(e));
        throw e;
      }
    }
    const r = await fetch(api("/api/push/subscribe"), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(sub),
    });
    const jr = await r.json().catch(() => ({}));
    const ok = r.ok && jr.ok !== false;
    if (!ok) reportDiag("post-sub", `HTTP ${r.status} ${JSON.stringify(jr).slice(0,120)}`);
    if (ok) store.set("qfa.push", "1");
    return { ok, error: ok ? "" : `注册失败 HTTP ${r.status}` };
  } catch (e) {
    console.warn("推送订阅失败", e);
    const msg = String(e?.message || e);
    let hint = msg;
    if (/permission|denied|NotAllowed/i.test(msg)) hint = "通知权限被拒绝（去 Chrome 设置里允许）";
    else if (/push service|AbortError|Registration failed/i.test(msg)) hint = "推送服务连不上（多为 VPN 或 Google 服务异常）";
    else if (/InvalidState|not active/i.test(msg)) hint = "Service Worker 未就绪（刷新一次再试）";
    else if (/applicationServerKey|InvalidAccess/i.test(msg)) hint = "VAPID 公钥无效";
    return { ok: false, error: hint };
  }
}

    .join("；")
    .slice(0, 180);

let liveTimer = null;

async function refreshLive({ silent = false } = {}) {
  if (OFFLINE || !DATA) return;
  const chip = $("#chipLive");
  if (chip) { chip.hidden = false; chip.textContent = "拉取最新净值…"; }

  const codes = DATA.funds.map((f) => f.code).slice(0, 40);
  let data = {};

  if (apiBase()) {
    // 有 Worker：服务端拉 lsjz（免 CORS，小），拿最新净值与当日涨跌
    try {
      const r = await fetch(api(`/api/latest?codes=${codes.join(",")}`));
      if (r.ok) {
        const j = await r.json();
        for (const [code, v] of Object.entries(j.data || {})) {
          data[code] = { chg: v.chg, at: v.date, nav: v.nav };
        }
      }
    } catch { /* 走下面的兜底 */ }
  }

  if (!Object.keys(data).length) {
    // 无 Worker：退回 JSONP 估值（该接口可能已失效，失败就隐藏）
    data = await fetchEstimates(codes);
  }

  if (!Object.keys(data).length) {
    if (chip) { chip.hidden = true; chip.textContent = ""; }
    return;
  }
  DATA.estimates = data;

  // 组合当日涨跌：有持仓按持仓权重，否则按本期建议权重
  let wsum = 0, acc = 0;
  const add = (code, w) => {
    const e = data[code];
    if (!e || !Number.isFinite(e.chg)) return;
    acc += e.chg * w;
    wsum += w;
  };
  if (state.holdings.length) {
    const total = state.holdings.reduce((a, h) => a + (h.amount || 0), 0) || 1;
    state.holdings.forEach((h) => add(h.code, (h.amount || 0) / total));
  } else {
    const alloc = buildAllocation({ funds: DATA.funds, corr: DATA.corr, risk: state.risk, amount: state.amount });
    alloc.picks.filter((p) => p.amount > 0).forEach((p) => add(p.code, p.weight));
  }

  const first = Object.values(data)[0] || {};
  const day = first.at ? String(first.at).slice(0, 10) : "";
  if (chip) {
    chip.hidden = false;
    const v = wsum > 0 ? acc / wsum : null;
    chip.textContent = v === null
      ? `最新 ${day}`
      : `最新 ${day} · 组合 ${v >= 0 ? "+" : ""}${(v * 100).toFixed(2)}%`;
    chip.classList.toggle("warn", v !== null && v < -0.02);
  }

  if (!silent) renderPool();
  clearTimeout(liveTimer);
  if (apiBase()) liveTimer = setTimeout(() => refreshLive({ silent: true }), 30 * 60 * 1000);
}

    ? state.holdings.map((h) => h.code)

  if (ok) {
    SCORES = scoreFunds(DATA.funds);
    DATA.asOf = DATA.funds.map((f) => f.end).filter(Boolean).sort().at(-1) || DATA.asOf;
    renderTopbar();
    render();
  }
  if (btn) { btn.disabled = false; btn.textContent = "刷新持仓数据（实时）"; }
  toast(ok ? `已更新 ${ok} 只基金的最新指标` : "没拉到数据（网络或接口限制）");
}

function friendlyErr(e) {
  const m = String((e && e.message) || e || "");
  if (/did not match the expected pattern|JSON|Unexpected token/i.test(m)) return "后台返回的不是数据（托管版没有接口），请用本地版";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "连不上后台（网络问题或服务没开）";
  if (/HTTP 404/.test(m)) return "接口不存在（托管版没有后台）";
  return m || "未知错误";
}

function renderBell() {
  const el = $("#bellBtn");
  if (!el) return;
  if (!notifySupported()) {
    el.textContent = "🔔 用 Chrome 开启通知";
    el.classList.remove("on");
    return;
  }
  if (notifyGranted()) {
    el.textContent = "🔔 提醒已开启";
    el.classList.add("on");
  } else {
    el.textContent = "🔔 开启卖出提醒";
    el.classList.remove("on");
  }
}

/* ---------------- 杂项 ---------------- */

function scrollToReport() {
  const el = $("#planMain");
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - 8;
  window.scrollTo({ top, behavior: "smooth" });
}

const DISCLAIMER_KEY = "qfa.disclaimer.day";

function showDisclaimer(force = false) {
  const el = $("#disclaimerModal");
  if (!el) return;
  const today = dateCN(new Date());
  if (!force && store.get(DISCLAIMER_KEY) === today) return; // 今天已确认过
  el.classList.add("on");
}
function hideDisclaimer() {
  $("#disclaimerModal")?.classList.remove("on");
  try { store.set(DISCLAIMER_KEY, dateCN(new Date())); } catch { /* ignore */ }
}

let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2200);
}

$$("#tabs button").forEach((b) =>
  b.addEventListener("click", () => {
    ui.view = b.dataset.view;
    render();
  })
);
$("#bellBtn")?.addEventListener("click", askNotify);
$("#acceptDisclaimer")?.addEventListener("click", hideDisclaimer);
$("#openDisclaimer")?.addEventListener("click", (e) => {
  e.preventDefault();
  showDisclaimer(true);
});
$("#disclaimerModal")?.addEventListener("click", (e) => {
  if (e.target.id === "disclaimerModal") hideDisclaimer();
});
$("#drawer").addEventListener("click", (e) => {
  if (e.target.id === "drawer") closeDrawer();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
});

boot();

})();
</script>
</body>
